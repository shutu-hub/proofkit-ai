intent: 验证 AIHR 普通 PDF 简历上传后完成抽取、候选人识别、岗位绑定和评估
level: core
mode: deterministic
sideEffectPolicy: allow
preconditions:
  - AIHR gateway and asynchronous workers are running in an isolated test environment
  - AIHR_PROOFKIT_ACCESS_TOKEN and actor headers point to a test workspace
  - AIHR_PROOFKIT_FIXTURE_PATH points to a sanitized PDF inside the external test workspace
  - AIHR_PROOFKIT_JOB_ID and AIHR_PROOFKIT_CLIENT_ITEM_KEY identify this test scope
actions:
  - kind: capability
    name: aihr.createResumeCollectionRun
    input:
      sourceChannel: "$env:AIHR_PROOFKIT_SOURCE_CHANNEL"
      taskName: proofkit-resume-upload
      candidateUid: "$env:AIHR_PROOFKIT_CANDIDATE_UID"
      conversationId: "$env:AIHR_PROOFKIT_CONVERSATION_ID"
      bossAccountId: "$env:AIHR_PROOFKIT_PLATFORM_ACCOUNT_ID"
  - kind: capability
    name: aihr.uploadResumeFile
    input:
      fixturePath: "$env:AIHR_PROOFKIT_FIXTURE_PATH"
      sourceChannel: "$env:AIHR_PROOFKIT_SOURCE_CHANNEL"
      originalFilename: proofkit-resume.pdf
      targetJobIds:
        - "$env:AIHR_PROOFKIT_JOB_ID"
      clientItemKey: "$env:AIHR_PROOFKIT_CLIENT_ITEM_KEY"
      resumeRole: online
      bossAccountId: "$env:AIHR_PROOFKIT_PLATFORM_ACCOUNT_ID"
      candidateUid: "$env:AIHR_PROOFKIT_CANDIDATE_UID"
      conversationId: "$env:AIHR_PROOFKIT_CONVERSATION_ID"
  - kind: capability
    name: aihr.waitResumeCollectionPipeline
    input:
      jobId: "$env:AIHR_PROOFKIT_JOB_ID"
      maxWaitMs: 300000
      pollIntervalMs: 1000
      requireCandidateBinding: true
      requireAssessmentSuccess: true
      requireWorkflowUsage: true
assertions: []
oracles:
  - aihr.resumeCollectionPipeline
  - aihr.billingUsage
metadata:
  aihr:
    jobId: "$env:AIHR_PROOFKIT_JOB_ID"
    requireCandidateBinding: true
    requireAssessmentSuccess: true
    requireWorkflowUsage: true
