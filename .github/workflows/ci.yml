name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:host-verifier
      - run: pnpm test:benchmark-datasets
      - name: Fetch pinned public browser tasks
        run: pnpm benchmark:datasets:fetch --dataset miniwob
      - name: Verify public MiniWoB task verdicts and evidence
        env:
          PROOFKIT_BROWSER_PATH: /usr/bin/google-chrome
        run: node tests/miniwob-benchmark.mjs
      - name: Preserve public benchmark evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proofkit-miniwob-regression
          path: .proofkit/benchmarks/miniwob-*/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Verify mobile MCP and WebDriver lifecycle
        run: node tests/mobile-smoke.mjs
      - name: Verify browser presentation and page lifecycle
        env:
          PROOFKIT_BROWSER_PATH: /usr/bin/google-chrome
        run: xvfb-run -a node tests/browser-presentation-smoke.mjs
      - name: Verify scripted Claude protocol and evidence chain
        env:
          PROOFKIT_BROWSER_PATH: /usr/bin/google-chrome
        run: node tests/host-evaluation-baseline.mjs --protocol claude-code --cases quick-pass,core-defect,project-gap,mobile-quick-pass,mobile-core-pass,mobile-core-defect
      - name: Verify Linux listener binding
        run: sudo env PROOFKIT_REQUIRE_LINUX_PROC=1 "$(command -v node)" tests/linux-target-binding-smoke.mjs

  install-distribution:
    name: Installed package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify packed package and installed CLI/MCP
        run: pnpm test:distribution
      - name: Verify installation from Git and source isolation
        run: pnpm test:git-install

  target-continuity-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke:target-continuity
      - run: pnpm test:smoke:ci-gate

  release-suite-windows:
    name: Web and Electron release matrix
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated Electron fixture runtime
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'proofkit-electron'
          npm install --prefix $fixtureRoot --no-save --no-audit --no-fund electron@28.3.3
          if ($LASTEXITCODE -ne 0) { throw 'Electron fixture installation failed' }
          $executable = Join-Path $fixtureRoot 'node_modules\electron\dist\electron.exe'
          if (-not (Test-Path -LiteralPath $executable)) { throw 'Electron fixture executable is missing' }
          Add-Content -Path $env:GITHUB_ENV -Value "PROOFKIT_ELECTRON_PATH=$executable"
      - name: Verify Web and Electron release evidence
        run: node tests/release-suite-smoke.mjs
      - name: Preserve synthetic evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proofkit-release-suite-windows
          path: .proofkit/local-runner-smoke/release-suite-*/test-workspace/.proofkit/
          if-no-files-found: ignore
          include-hidden-files: true
