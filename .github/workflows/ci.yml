name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:host-verifier
      - name: Verify mobile MCP and WebDriver lifecycle
        run: node tests/mobile-smoke.mjs
      - name: Verify scripted Claude protocol and evidence chain
        env:
          PROOFKIT_BROWSER_PATH: /usr/bin/google-chrome
        run: node tests/host-evaluation-baseline.mjs --protocol claude-code --cases quick-pass,core-defect,project-gap,mobile-quick-pass,mobile-core-pass,mobile-core-defect
      - run: pnpm test:distribution
      - run: pnpm test:git-install
      - name: Verify Linux listener binding
        run: sudo env PROOFKIT_REQUIRE_LINUX_PROC=1 "$(command -v node)" tests/linux-target-binding-smoke.mjs

  target-continuity-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke:target-continuity
      - run: pnpm test:smoke:ci-gate
